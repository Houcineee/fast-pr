[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-pr"
version = "0.1.0"
description = "A local Codex-powered GitHub pull request reviewer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
fast-pr = "fast_pr.cli:main"

[tool.setuptools.package-data]
fast_pr = ["templates/*", "templates/skill/*"]
